<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cumple Minioms - Lucca y Luisina</title>
<style>
:root{
  --yellow:#ffe04a;
  --yellow2:#ffc928;
  --blue:#2457c5;
  --blue2:#123682;
  --ink:#171717;
  --paper:#fffdf4;
  --pink:#ff75b8;
  --red:#ff5757;
  --green:#28c886;
  --sky:#8fe4ff;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;overflow-x:hidden}

body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:clamp(8px,2.5vw,22px);
  font-family:"Trebuchet MS","Comic Sans MS",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 16% 12%,rgba(255,255,255,.88) 0 8%,transparent 9%),
    radial-gradient(circle at 84% 8%,rgba(255,117,184,.38) 0 8%,transparent 9%),
    radial-gradient(circle at 82% 84%,rgba(36,87,197,.32) 0 12%,transparent 13%),
    linear-gradient(180deg,#8fe4ff 0%,#fff27f 50%,#ffd23c 100%);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.34;
  background-image:
    radial-gradient(circle,#fff 0 2px,transparent 3px),
    radial-gradient(circle,#2457c5 0 2px,transparent 3px),
    radial-gradient(circle,#ff5757 0 2px,transparent 3px),
    radial-gradient(circle,#28c886 0 2px,transparent 3px);
  background-size:52px 58px,72px 70px,86px 78px,64px 86px;
  background-position:4px 10px,26px 32px,48px 18px,16px 62px;
}

button{font:inherit}

.app{
  width:min(100%,460px);
  min-height:min(790px,calc(100vh - 16px));
  position:relative;
}

.screen{
  width:100%;
  min-height:min(790px,calc(100vh - 16px));
  position:relative;
  overflow:hidden;
  border:clamp(5px,1.8vw,8px) solid #fff;
  border-radius:clamp(24px,7vw,38px);
  box-shadow:0 24px 58px rgba(14,31,77,.35), inset 0 0 0 2px rgba(0,0,0,.05);
  background:
    radial-gradient(circle at 20% 17%,rgba(255,255,255,.92) 0 10%,transparent 11%),
    radial-gradient(circle at 82% 28%,rgba(255,255,255,.52) 0 8%,transparent 9%),
    linear-gradient(180deg,#89e0ff 0%,#fff287 42%,#ffd347 74%,#2457c5 74%,#123682 100%);
}

.screen::after{
  content:"";
  position:absolute;
  left:-5%;
  right:-5%;
  bottom:-1px;
  height:27%;
  z-index:0;
  background:
    radial-gradient(ellipse at 12% 0%,#326bd4 0 28%,transparent 29%),
    radial-gradient(ellipse at 44% 0%,#2b62ce 0 31%,transparent 32%),
    radial-gradient(ellipse at 78% 0%,#3b72df 0 29%,transparent 30%),
    linear-gradient(#2457c5,#123682);
  opacity:.96;
}

.game-screen{
  padding:clamp(16px,4.6vw,26px) clamp(12px,4vw,20px);
  display:flex;
  flex-direction:column;
  align-items:center;
  animation:firstPop .65s ease both;
  transition:opacity .55s ease, transform .55s ease;
}
.game-screen.hide{opacity:0;transform:scale(.96) rotate(-1deg)}

.invite-screen{
  display:none;
  padding:clamp(15px,4.6vw,24px) clamp(12px,3.8vw,20px);
  text-align:center;
  opacity:0;
  transform:scale(.9);
}
.invite-screen.show{display:block;animation:cardPop .75s cubic-bezier(.17,.9,.26,1.22) forwards}

.confetti span{
  position:absolute;
  z-index:3;
  top:-30px;
  width:clamp(6px,1.8vw,9px);
  height:clamp(10px,2.8vw,15px);
  border-radius:4px 2px 5px 2px;
  opacity:.78;
  animation:fall linear infinite;
}
.confetti span:nth-child(1){left:6%;background:var(--red);animation-duration:5.2s}
.confetti span:nth-child(2){left:18%;background:#fff;animation-duration:6.5s;animation-delay:-1s}
.confetti span:nth-child(3){left:30%;background:var(--blue);animation-duration:5.9s;animation-delay:-2.5s}
.confetti span:nth-child(4){left:43%;background:var(--pink);animation-duration:7.1s;animation-delay:-1.8s}
.confetti span:nth-child(5){left:58%;background:var(--green);animation-duration:5.4s;animation-delay:-3.5s}
.confetti span:nth-child(6){left:70%;background:#111;animation-duration:6.7s;animation-delay:-.7s}
.confetti span:nth-child(7){left:82%;background:#fff25c;animation-duration:5.8s;animation-delay:-3s}
.confetti span:nth-child(8){left:93%;background:var(--red);animation-duration:7.5s;animation-delay:-2s}

.burst span{
  position:absolute;
  z-index:35;
  left:50%;
  top:45%;
  width:10px;
  height:16px;
  border-radius:4px;
  opacity:0;
  background:var(--pink);
}
.burst.show span{animation:burst .75s ease-out forwards}
.burst span:nth-child(2){background:#fff25c;--x:-92px;--y:-78px}
.burst span:nth-child(3){background:var(--blue);--x:78px;--y:-84px}
.burst span:nth-child(4){background:var(--green);--x:-98px;--y:52px}
.burst span:nth-child(5){background:var(--red);--x:86px;--y:58px}
.burst span:nth-child(6){background:#fff;--x:12px;--y:-105px}
.burst span:nth-child(7){background:#111;--x:-38px;--y:96px}
.burst span:nth-child(8){background:#ff9f1c;--x:42px;--y:98px}

.balloon{
  position:absolute;
  z-index:2;
  width:clamp(34px,10vw,54px);
  height:clamp(46px,13vw,70px);
  border-radius:50% 50% 46% 46%;
  animation:balloonFloat 5.6s ease-in-out infinite;
  opacity:.92;
}
.balloon::before{
  content:"";
  position:absolute;
  left:22%;
  top:17%;
  width:22%;
  height:22%;
  background:rgba(255,255,255,.65);
  border-radius:50%;
}
.balloon::after{
  content:"";
  position:absolute;
  left:50%;
  top:98%;
  width:2px;
  height:60px;
  background:rgba(0,0,0,.28);
}
.b1{left:8px;top:86px;background:#ff75b8;transform:rotate(-8deg)}
.b2{right:10px;top:122px;background:#2457c5;animation-delay:-1.8s;transform:rotate(7deg)}
.b3{left:24px;bottom:92px;background:#fff25c;animation-delay:-3s;transform:rotate(4deg)}
.b4{right:22px;bottom:84px;background:#ff5757;animation-delay:-2.7s;transform:rotate(-8deg)}

.serpentine{
  position:absolute;
  z-index:2;
  width:96px;
  height:36px;
  border-top:5px dashed rgba(18,54,130,.48);
  border-radius:50%;
  animation:wiggle 4.8s ease-in-out infinite;
}
.s1{left:16px;top:24px;transform:rotate(-18deg)}
.s2{right:8px;bottom:24px;border-color:rgba(255,117,184,.55);animation-delay:-1.4s;transform:rotate(15deg)}
.s3{left:38%;top:92px;border-color:rgba(255,255,255,.65);animation-delay:-2.2s;transform:rotate(6deg)}

.sticker{
  position:absolute;
  z-index:7;
  background:#fffdf4;
  color:#111;
  border:3px solid #111;
  border-radius:17px 14px 19px 15px;
  padding:7px 10px;
  font-weight:1000;
  box-shadow:4px 5px 0 rgba(0,0,0,.17);
}
.sticker.star{right:18px;top:18px;transform:rotate(9deg);font-size:clamp(15px,4.5vw,20px)}
.sticker.pow{left:16px;bottom:26px;transform:rotate(-7deg);font-size:clamp(14px,4vw,18px)}

.game-title{
  position:relative;
  z-index:10;
  width:min(96%,350px);
  margin:5px auto 10px;
  padding:clamp(13px,4vw,18px);
  background:#fff;
  border:4px solid #111;
  border-radius:24px 18px 26px 20px;
  box-shadow:0 8px 0 var(--blue2);
  transform:rotate(-1.7deg);
  text-align:center;
}
.game-title h1{
  font-size:clamp(22px,6.3vw,31px);
  line-height:1.05;
  color:var(--blue);
  text-shadow:1px 2px 0 #ffe14a;
}

.counter{
  position:relative;
  z-index:10;
  margin:10px 0 4px;
  padding:9px 13px;
  background:#111;
  color:#ffe14a;
  border:3px solid #fff;
  border-radius:18px;
  font-size:clamp(16px,4.6vw,20px);
  font-weight:1000;
  box-shadow:0 6px 0 rgba(0,0,0,.18);
}

.game-area{
  position:relative;
  z-index:6;
  width:100%;
  flex:1;
  min-height:510px;
  margin-top:0;
}

.banana{
  position:absolute;
  z-index:16;
  width:clamp(54px,16vw,78px);
  height:clamp(40px,11vw,54px);
  border:0;
  background:transparent;
  cursor:pointer;
  transform:rotate(var(--rot));
  animation:bananaBob 2.35s ease-in-out infinite;
  -webkit-tap-highlight-color:transparent;
}
.banana::before{
  content:"";
  position:absolute;
  inset:5% 4% 12% 2%;
  border-bottom:clamp(13px,3.7vw,18px) solid #ffd32a;
  border-radius:0 0 100% 100%;
  transform:rotate(-12deg);
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.18));
}
.banana::after{
  content:"";
  position:absolute;
  right:1px;
  top:18px;
  width:8px;
  height:9px;
  border-radius:5px;
  background:#60350f;
  transform:rotate(-25deg);
}
.banana.found{pointer-events:none;animation:bananaFound .42s ease forwards}
.banana.one{left:5%;top:29%;--rot:-18deg;animation-delay:-.4s}
.banana.two{right:7%;top:22%;--rot:14deg;animation-delay:-1.1s}
.banana.three{left:43%;top:68%;--rot:6deg;animation-delay:-1.7s}
.banana.four{right:8%;top:57%;--rot:-25deg;animation-delay:-.2s}
.banana.five{left:20%;top:74%;--rot:23deg;animation-delay:-1.3s}
.banana.six{left:38%;top:14%;--rot:-4deg;animation-delay:-2s}

.reaction{
  position:absolute;
  z-index:38;
  pointer-events:none;
  padding:7px 10px;
  background:#fff;
  border:3px solid #111;
  border-radius:18px 14px 19px 15px;
  color:var(--blue);
  font-weight:1000;
  box-shadow:3px 5px 0 rgba(0,0,0,.18);
  animation:reactionPop .85s ease-out forwards;
}

.unlock{
  position:absolute;
  z-index:40;
  left:50%;
  top:47%;
  width:min(88%,330px);
  display:none;
  transform:translate(-50%,-50%) scale(.78);
  opacity:0;
  background:#fff;
  border:5px solid #111;
  border-radius:26px 20px 30px 22px;
  color:var(--blue);
  padding:18px 16px;
  font-weight:1000;
  font-size:clamp(23px,6.6vw,32px);
  line-height:1.05;
  text-shadow:1px 2px 0 #ffe14a;
  box-shadow:0 12px 0 var(--blue2);
}
.unlock.show{display:block;animation:unlockPop 1s ease forwards}

.minion{
  position:relative;
  width:clamp(104px,31vw,136px);
  height:clamp(172px,48vw,218px);
  background:linear-gradient(90deg,#ffe85c 0%,#ffd500 55%,#f1bd05 100%);
  border:5px solid #111;
  border-radius:72px 72px 34px 34px;
  box-shadow:inset -13px 0 rgba(0,0,0,.09), inset 10px 0 rgba(255,255,255,.18), 0 13px 0 rgba(0,0,0,.13);
  animation:minionDance 1.36s ease-in-out infinite;
}
.minion::after{
  content:"";
  position:absolute;
  left:20%;
  top:7%;
  width:20%;
  height:10%;
  border-radius:50%;
  background:rgba(255,255,255,.25);
  transform:rotate(-18deg);
}
.game-minion{position:absolute;z-index:13}
.game-minion.mg1{right:5%;top:43%}
.game-minion.mg2{left:4%;top:46%;transform:scale(.88);animation-delay:-.55s}
.game-minion.mg3{left:38%;top:73%;transform:scale(.62) rotate(-4deg);animation-delay:-1.1s}
.minion.smallish{width:clamp(92px,27vw,122px);height:clamp(154px,42vw,195px);animation-delay:-.45s}
.mini{
  position:absolute;
  z-index:11;
  width:clamp(54px,15vw,72px);
  height:clamp(86px,24vw,112px);
  border-width:4px;
  border-radius:38px 38px 20px 20px;
  animation:minionPeek 2.4s ease-in-out infinite;
}
.peek-top{top:-42px;left:54px;transform:rotate(-6deg)}
.peek-right{right:-22px;top:360px;transform:rotate(9deg);animation-delay:-1s}
.peek-left{left:-20px;top:250px;transform:rotate(-9deg);animation-delay:-1.6s}
.peek-bottom{bottom:-42px;right:70px;transform:rotate(6deg);animation-delay:-.7s}

.hair{
  position:absolute;
  left:50%;
  top:-21px;
  width:4px;
  height:22px;
  background:#111;
  border-radius:8px;
  transform:translateX(-50%) rotate(14deg);
}
.hair::before,.hair::after{
  content:"";
  position:absolute;
  top:4px;
  width:4px;
  height:20px;
  background:#111;
  border-radius:8px;
}
.hair::before{left:-13px;transform:rotate(-35deg)}
.hair::after{right:-13px;transform:rotate(35deg)}
.hair.sprout{height:16px;top:-17px}
.hair.sprout::before{left:-8px;top:7px;height:13px;transform:rotate(-60deg)}
.hair.sprout::after{right:-8px;top:7px;height:13px;transform:rotate(60deg)}

.strap{
  position:absolute;
  left:0;
  top:26%;
  width:100%;
  height:18px;
  background:#202020;
}
.goggles{
  position:absolute;
  z-index:3;
  left:50%;
  top:15%;
  display:flex;
  gap:3px;
  transform:translateX(-50%);
}
.goggle{
  width:clamp(43px,13vw,58px);
  height:clamp(43px,13vw,58px);
  border-radius:50%;
  border:7px solid #858585;
  background:linear-gradient(145deg,#f1f1f1,#bababa);
  display:grid;
  place-items:center;
  box-shadow:inset 0 0 0 3px #b5b5b5, 0 3px 0 rgba(0,0,0,.25);
}
.mini .goggle{width:32px;height:32px;border-width:5px}
.goggle .eye{
  position:relative;
  width:62%;
  height:62%;
  border-radius:50%;
  background:#fff;
  overflow:hidden;
}
.goggle .eye::before{
  content:"";
  position:absolute;
  left:18%;
  top:14%;
  width:28%;
  height:20%;
  border-radius:50%;
  background:rgba(255,255,255,.9);
  z-index:2;
}
.goggle .eye::after{
  content:"";
  position:absolute;
  left:var(--look-x,45%);
  top:var(--look-y,45%);
  width:42%;
  height:42%;
  border-radius:50%;
  background:#111;
  transform:translate(-50%,-50%);
  animation:lookAround 2.7s ease-in-out infinite;
}
.look-left{--look-x:35%;--look-y:48%}
.look-right{--look-x:62%;--look-y:43%}
.look-up{--look-x:48%;--look-y:34%}
.one-eye .goggles{gap:0}
.one-eye .goggle:nth-child(2){display:none}

.mouth{
  position:absolute;
  left:50%;
  top:53%;
  width:46px;
  height:25px;
  border:4px solid #111;
  background:#521919;
  border-radius:5px 5px 26px 26px;
  transform:translateX(-50%) rotate(-2deg);
}
.mouth::after{
  content:"";
  position:absolute;
  left:9px;
  top:2px;
  width:20px;
  height:6px;
  border-radius:0 0 9px 9px;
  background:#fff;
}
.mouth.smirk{
  height:17px;
  border:0;
  border-bottom:5px solid #111;
  background:transparent;
  border-radius:0 0 30px 30px;
}
.mouth.smirk::after{display:none}
.mini .mouth{width:28px;height:15px;border-width:3px}

.overalls{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:39%;
  background:
    linear-gradient(90deg,transparent 0 18%,rgba(255,255,255,.14) 19% 22%,transparent 23% 100%),
    linear-gradient(#2f65cf,#1f51b8);
  border-top:5px solid #111;
  border-radius:0 0 28px 28px;
}
.overalls::before{
  content:"";
  position:absolute;
  left:50%;
  top:17%;
  width:37px;
  height:35px;
  border-radius:9px 9px 14px 14px;
  background:#123682;
  border:3px solid #111;
  transform:translateX(-50%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);
}
.overalls::after{
  content:"";
  position:absolute;
  left:calc(50% - 4px);
  top:calc(17% + 9px);
  width:8px;
  height:15px;
  border-left:4px solid #fff;
  border-bottom:4px solid #fff;
  transform:rotate(-25deg);
}
.stitch{
  position:absolute;
  bottom:31%;
  left:13%;
  width:74%;
  border-top:2px dashed rgba(255,255,255,.7);
  z-index:4;
}

.minion .arm{
  position:absolute;
  z-index:-1;
  top:46%;
  width:19px;
  height:72px;
  background:#ffd500;
  border:4px solid #111;
  border-radius:14px;
}
.minion .arm::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-13px;
  width:22px;
  height:18px;
  background:#111;
  border-radius:50%;
  transform:translateX(-50%);
}
.minion .arm.left{left:-18px;transform:rotate(45deg);animation:armUpLeft 1.5s ease-in-out infinite}
.minion .arm.right{right:-18px;transform:rotate(-55deg);animation:armUpRight 1.5s ease-in-out infinite}
.foot{
  position:absolute;
  bottom:-13px;
  width:39px;
  height:17px;
  background:#111;
  border-radius:16px 16px 8px 8px;
}
.foot.left{left:21%}
.foot.right{right:21%}
.mini .foot{width:24px;height:11px;bottom:-9px}

.invite-card{
  position:relative;
  z-index:10;
  min-height:calc(100vh - 42px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:clamp(11px,3.2vw,17px);
}
.title{
  position:relative;
  z-index:12;
  background:#2457c5;
  color:#fff;
  padding:clamp(12px,3.8vw,16px);
  border:4px solid #111;
  border-radius:24px 19px 27px 20px;
  font-size:clamp(25px,7vw,36px);
  line-height:1.05;
  font-weight:1000;
  text-shadow:3px 3px 0 #111;
  transform:rotate(-2deg);
  box-shadow:0 8px 0 #123682;
}
.intro{
  position:relative;
  z-index:12;
  align-self:center;
  width:max-content;
  max-width:96%;
  padding:8px 13px;
  background:#fff;
  border:3px solid #111;
  border-radius:17px;
  font-size:clamp(18px,5vw,23px);
  font-weight:1000;
  transform:rotate(1.2deg);
  box-shadow:4px 5px 0 rgba(0,0,0,.16);
}
.names{
  position:relative;
  z-index:12;
  font-size:clamp(46px,14vw,70px);
  line-height:.88;
  font-weight:1000;
  color:#fff;
  text-shadow:4px 4px 0 #2457c5,7px 7px 0 #111;
  animation:nameBounce 2s ease-in-out infinite;
}
.names .amp{
  display:block;
  color:#111;
  text-shadow:2px 2px 0 #fff,4px 4px 0 #2457c5;
  font-size:.78em;
  transform:rotate(-5deg);
}
.characters{
  position:relative;
  z-index:12;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:clamp(15px,5vw,24px);
  min-height:clamp(176px,48vw,225px);
}
.details{
  position:relative;
  z-index:12;
  display:grid;
  gap:clamp(9px,2.8vw,12px);
}
.detail{
  display:grid;
  grid-template-columns:auto 1fr;
  align-items:center;
  gap:10px;
  background:#fff;
  border:4px solid #2457c5;
  border-radius:19px 16px 23px 17px;
  padding:clamp(10px,3vw,13px) clamp(12px,3.5vw,16px);
  color:#111;
  box-shadow:0 7px 0 rgba(18,54,130,.95),0 12px 18px rgba(0,0,0,.13);
  text-align:left;
}
.detail .icon{font-size:clamp(29px,8vw,40px);line-height:1}
.detail .text{font-size:clamp(20px,5.4vw,26px);font-weight:1000}
.detail:nth-child(1){transform:rotate(-1.3deg)}
.detail:nth-child(2){transform:rotate(1deg)}
.detail:nth-child(3){transform:rotate(-.6deg)}
.footer{
  position:relative;
  z-index:12;
  background:#111;
  color:#ffe14a;
  border:3px solid #fff;
  border-radius:21px 18px 24px 19px;
  padding:clamp(12px,3.5vw,15px);
  font-size:clamp(18px,5vw,24px);
  line-height:1.1;
  font-weight:1000;
  box-shadow:0 7px 0 rgba(0,0,0,.18);
  animation:footerWiggle 2.6s ease-in-out infinite;
}
.deco-banana{
  position:absolute;
  z-index:11;
  width:54px;
  height:38px;
  transform:rotate(-18deg);
  animation:bananaBob 2.6s ease-in-out infinite;
}
.deco-banana::before{
  content:"";
  position:absolute;
  inset:5px 2px;
  border-bottom:15px solid #ffd32a;
  border-radius:0 0 100% 100%;
}
.db1{right:22px;top:250px}
.db2{left:24px;top:318px;transform:rotate(20deg);animation-delay:-1s}

<script>
const bananas = document.querySelectorAll(".banana");
const counter = document.getElementById("counter");
const gameArea = document.getElementById("gameArea");
const unlock = document.getElementById("unlock");
const gameScreen = document.getElementById("gameScreen");
const inviteScreen = document.getElementById("inviteScreen");
const burst = document.getElementById("burst");
const words = ["¡Banana!", "¡Bello!", "¡Genial!"];
let found = 0;
let unlocked = false;

function showReaction(target){
  const rect = target.getBoundingClientRect();
  const areaRect = gameArea.getBoundingClientRect();
  const bubble = document.createElement("div");
  bubble.className = "reaction";
  bubble.textContent = words[Math.floor(Math.random() * words.length)];
  bubble.style.left = Math.min(areaRect.width - 98, Math.max(6, rect.left - areaRect.left + rect.width * .12)) + "px";
  bubble.style.top = Math.max(8, rect.top - areaRect.top - 10) + "px";
  gameArea.appendChild(bubble);
  setTimeout(() => bubble.remove(), 900);
}

function celebrateMinioms(){
  document.querySelectorAll(".game-minion").forEach((m, i) => {
    m.style.animation = `minionJump .55s ease ${i * 0.04}s`;
    setTimeout(() => { m.style.animation = ""; }, 650);
  });
}

function unlockInvite(){
  unlocked = true;
  unlock.classList.add("show");
  burst.classList.add("show");
  setTimeout(() => {
    gameScreen.classList.add("hide");
    setTimeout(() => {
      gameScreen.style.display = "none";
      inviteScreen.classList.add("show");
    }, 540);
  }, 1180);
}

bananas.forEach((banana) => {
  banana.addEventListener("click", () => {
    if (unlocked || banana.classList.contains("found")) return;
    banana.classList.add("found");
    found += 1;
    counter.textContent = `Bananas encontradas: ${found}/3`;
    showReaction(banana);
    celebrateMinioms();
    if (found >= 3) unlockInvite();
  });
});
</script>
